name: realm-night-sky
description: |
  The sky above your places. Every place you already track — a
  realm-weather WeatherLocation or a realm-uk-streets UkPlace — quietly
  grows a night: when astronomical darkness actually falls, how much moon
  is in the way, how cloudy it will be hour by hour through the dark,
  when the ISS crosses over, and what the planetary K index says about
  aurora at that latitude.

  Nothing here is stored. Five keyless sources are joined ON DEMAND onto
  coordinates that other realms already hold, so the realm is a pure
  enrichment layer: install it and "where should I point a telescope
  tonight" becomes a saved view over places you never re-entered.

  Ships the Observatory app (`apps/the-observatory.html`) — the same ground
  seen rather than queried: tonight ranked across every tracked place, the
  cloud drawn hour by hour through the dark so you can see when to go out, the
  moon, the ISS, and the aurora outlook judged against each latitude.

  Sources: MET Norway (moon), sunrise-sunset.org (astronomical twilight),
  Open-Meteo (hourly cloud through the night), NOAA SWPC (planetary K
  index forecast), and G7VRD (ISS pass predictions). No API keys, no
  accounts, no configuration.
version: 0.1.0
